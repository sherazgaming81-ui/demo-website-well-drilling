<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fpFlake" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fe4ff"/>
      <stop offset=".52" stop-color="#1f9bd6"/>
      <stop offset="1" stop-color="#0a4f74"/>
    </linearGradient>
    <radialGradient id="fpGlow" cx=".32" cy=".26" r=".62">
      <stop offset="0" stop-color="#eafaff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#eafaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fpShadow" x="-24%" y="-24%" width="148%" height="148%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.2" flood-color="#06283a" flood-opacity=".34"/>
    </filter>
    <style>
      /* A slow turn, plus the arm tips catching light. Same rules as the site:
         never on touch screens, and off entirely for reduced-motion visitors. */
      .fp-turn { transform-origin: 32px 32px; animation: fp-turn 42s linear infinite; }
      .fp-spark { animation: fp-spark 5.5s ease-in-out infinite; }
      @keyframes fp-turn { to { transform: rotate(360deg); } }
      @keyframes fp-spark { 0%, 100% { opacity: .45; } 45% { opacity: 1; } }
      @media (pointer: coarse), (hover: none), (prefers-reduced-motion: reduce) {
        .fp-turn, .fp-spark { animation: none; }
      }
    </style>
  </defs>

  <g class="fp-turn" filter="url(#fpShadow)">
    <circle cx="32" cy="32" r="30" fill="url(#fpFlake)"/>
    <circle cx="32" cy="32" r="30" fill="url(#fpGlow)"/>
    <g stroke="#ffffff" stroke-width="3.1" stroke-linecap="round" fill="none">
      <path d="M32 12v40M14.7 22l34.6 20M49.3 22 14.7 42"/>
      <path d="M32 12l-4.6 5.4M32 12l4.6 5.4M32 52l-4.6-5.4M32 52l4.6-5.4"/>
      <path d="M14.7 22l6.7.9M49.3 42l-6.7-.9M49.3 22l-6.7.9M14.7 42l6.7-.9"/>
    </g>
    <circle class="fp-spark" cx="32" cy="32" r="4.4" fill="#eafaff"/>
  </g>
</svg>
